<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Futhis</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://jsdelivr.net"></script>
    <script src="script.js" defer></script>
</head>
<body>

    <header class="header-principal">
        <a href="principal.html" class="logo-retornar">
            <img src="logo.png" alt="Futhis">
        </a>

        <nav class="menu-usuario">
            <a href="perfil.html" class="btn-perfil">
                <span class="icon-perfil">👤</span> Meu Perfil
            </a>
            <a href="index.html" class="btn-logout" title="Sair da conta">
                <span class="icon-sair">🚪</span> Sair
            </a>
        </nav>
    </header>

<main class="conteudo-principal">
        <h2>Painel Analítico de Futebol</h2>
        <p class="subtitulo">Dados reais coletados via API e estatísticas de desempenho.</p>

        <section class="secao-goleiros">
            <div class="grid-cards-futebol">
            </div>
        </section>

        <section class="secao-dashboard" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-top: 40px;">
            <div class="form-container" style="margin: 0; max-width: 100%; padding: 20px;">
                <h3 style="font-size: 1rem; margin-bottom: 15px; color: var(--cor-destaque);">📊 Desempenho do G-4</h3>
                <canvas id="graficoGols"></canvas>
            </div>
            <div class="form-container" style="margin: 0; max-width: 100%; padding: 20px;">
                <h3 style="font-size: 1rem; margin-bottom: 15px; color: var(--cor-destaque);">📈 Evolução de Pontos</h3>
                <canvas id="graficoPontos"></canvas>
            </div>
            <div class="form-container" style="margin: 0; max-width: 100%; padding: 20px;">
                <h3 style="font-size: 1rem; margin-bottom: 15px; color: var(--cor-destaque);">🧤 Tipos de Defesas</h3>
                <canvas id="graficoDefesas"></canvas>
            </div>
        </section>

        <section class="secao-crud" style="margin-top: 40px;">
            <div class="form-container" style="max-width: 100%; margin: 0; padding: 25px;">
                <h3>📝 Minhas Análises e Palpites (CRUD)</h3>
                <div class="input-group" style="margin-top: 15px;">
                    <label>Nova Anotação Tática</label>
                    <input type="text" id="input-analise" placeholder="Ex: Palmeiras deve manter linha alta na próxima rodada...">
                </div>
                <button class="btn-enviar" id="btn-salvar-analise" style="max-width: 200px;">Salvar no Banco</button>
                
                <ul id="lista-analises" style="margin-top: 20px; list-style: none; color: var(--texto-claro);">
                </ul>
            </div>
        </section>
    </main>

</body>
</html>
