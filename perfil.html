<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Perfil - Lance de Ouro</title>
    <link rel="stylesheet" href="estilo.css">
    <script src="auth.js" defer></script>
</head>
<body>

    <header class="header-principal">
        <a href="principal.html" class="logo-retornar">
            <img src="logo.png" alt="Lance de Ouro">
        </a>
        <nav class="menu-usuario">
            <a href="principal.html" class="btn-perfil">🏠 Painel</a>
            <a href="#" onclick="encerarSessao(); return false;" class="btn-logout">🚪 Sair</a>
        </nav>
    </header>

    <main class="form-container" style="max-width: 800px; margin: 40px auto;">
        <h2>Meu Perfil de Torcedor</h2>
        <p class="subtitulo">Gerencie suas informações e acesse seu conteúdo salvo.</p>

        <section class="secao-perfil-dados" style="margin-bottom: 40px; padding-bottom: 20px; border-bottom: 1px solid var(--borda);">
            <div class="input-group">
                <label>Nome do Usuário</label>
                <input type="text" id="perfil-nome">
            </div>
            <div class="input-group">
                <label>E-mail</label>
                <input type="email" id="perfil-email">
            </div>
            <div class="input-group">
                <label>Time de Coração</label>
                <input type="text" id="perfil-time" placeholder="Insira seu time">
            </div>
            <button class="btn-enviar" id="btn-atualizar-perfil" style="max-width: 200px; margin-bottom: 0;">Salvar Alterações</button>
        </section>

        <section class="secao-salvos">
            <h3 style="color: var(--cor-destaque); margin-bottom: 20px;">⭐ Meu Acervo Salvo</h3>
            
            <div class="players-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px;">
                
                <div class="player-card" style="border: 1px solid var(--borda);">
                    <div class="player-photo" style="height: 120px; background-image: url('https://glbimg.com'); background-size: cover; background-position: center;"></div>
                    <div class="player-name" style="text-align: left; padding: 15px;">
                        <span style="color: var(--cor-destaque); font-size: 0.8rem; display: block; margin-bottom: 5px;">HISTÓRICO</span>
                        <h4>A Batalha de 2026</h4>
                        <p style="font-size: 0.8rem; color: var(--texto-mutado); font-weight: normal; margin-top: 5px;">Salvo em 20/10/2026</p>
                    </div>
                </div>

                <div class="player-card" style="border: 1px solid var(--borda);">
                    <div class="player-photo" style="height: 120px; background-image: url('https://glbimg.com'); background-size: cover; background-position: center;"></div>
                    <div class="player-name" style="text-align: left; padding: 15px;">
                        <span style="color: var(--cor-destaque); font-size: 0.8rem; display: block; margin-bottom: 5px;">GOLEIROS</span>
                        <h4>Defesa Histórica de Vozinha</h4>
                        <p style="font-size: 0.8rem; color: var(--texto-mutado); font-weight: normal; margin-top: 5px;">⭐ Votação: 9.8/10</p>
                    </div>
                </div>

            </div>
        </section>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            checarSessao();

            const dadosUsuario = localStorage.getItem("usuarioLogado");
            if (dadosUsuario) {
                const usuario = JSON.parse(dadosUsuario);
                
                const inputNome = document.getElementById("perfil-nome");
                const inputEmail = document.getElementById("perfil-email");
                
                if (inputNome && usuario.nome) {
                    inputNome.value = usuario.nome;
                }
                if (inputEmail && usuario.email) {
                    inputEmail.value = usuario.email;
                }
            }
        });
    </script>
</body>
</html>
