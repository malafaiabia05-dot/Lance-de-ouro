<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Futhis</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
  <main class="layoutsplit">

<div class="telaesq"></div>

    <div class= "ladodir">
 <div class="form-container">
    <a href="index.html" class="logo-retornar">
        <img src="imagens/logo.png" alt="Voltar">
    </a>

    <h2>Entre para o Clube</h2>
    <p class="subtitulo">Crie seu perfil de torcedor e acesse o acervo.</p>

    <form action="#" method="POST">
      <div class="input-group">
        <label for="nome">Nome Completo</label>
        <input type="text" id="nome" placeholder="Seu nome" required>
      </div>

      <div class="input-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="seu@email.com" required>
      </div>

      <div class="input-group">
        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="No mínimo 6 caracteres" required>
      </div>

      <button type="submit" class="btn-enviar"href="principal.html">Cadastrar perfil</button>


      <div class="divisor">ou</div>
      <p class="link-alternativo">
        Já tem uma conta?<a href="login.html">Fazer login</a>
      </p>
    </form>
  </div>
  </div>

  
  </main>
</body>
</html>
