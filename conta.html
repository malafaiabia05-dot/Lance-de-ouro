<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Lance de Ouro</title>
    <link rel="stylesheet" href="estilo.css">
    <script src="auth.js" defer></script>
</head>
<body>
 <div class="form-container">
    <a href="index.html" class="logo-retornar">
        <img src="logo.png" alt="Voltar">
    </a>

    <h2>Entre para o Clube</h2>
    <p class="subtitulo">Crie seu perfil de torcedor e acesse o acervo.</p>

    <form id="form-cadastro">
      <div class="input-group">
        <label for="nome">Nome Completo</label>
        <input type="text" id="nome" placeholder="Seu nome" required>
      </div>

      <div class="input-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="seu@email.com" required>
      </div>

      <div class="input-group">
        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="No mínimo 6 caracteres" required minlength="6">
      </div>

      <button type="submit" class="btn-enviar">Cadastrar perfil</button>

      <div class="divisor">ou</div>
      
      <p class="link-alternativo">
        Já tem uma conta? <a href="login.html">Fazer login</a>
      </p>
    </form>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("form-cadastro").addEventListener("submit", (e) => {
        e.preventDefault();
        const nome = document.getElementById("nome").value;
        const email = document.getElementById("email").value;
        const senha = document.getElementById("senha").value;

        cadastrarUsuario(nome, email, senha);
      });
    });
  </script>
</body>
</html>
