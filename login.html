<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Futhis</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>

  <main class="layout">
    <a href="index.html" class="logo-retornar">
    <img src="logo.png">
</a>

  <div class="form-container">
    <h2>Bem-vindo de volta!</h2>
    <p class="subtitulo">Entre com suas credenciais para acessar o acervo.</p>

    <form action="#" method="POST">
      <div class="input-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="seu@email.com" required>
      </div>

        <div class="input-group">
          <label for="senha">Senha</label>
          <input type="password" id="senha" placeholder="Sua senha" required>
        </div>

      <button type="submit" class="btn-enviar">Acessar conta</button>
      
    <div class="container-esqueci">
     <a href="recuperar.html" class="link-esqueci">Esqueci minha senha</a>
      </div>

      <p class="link-alternativo">
        Não tem uma conta?<a href="conta.html">Criar perfil</a>
      </p>
    </form>
  </div>
</body>

</html>
