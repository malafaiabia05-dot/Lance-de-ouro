<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Lance de Ouro</title>
  <link rel="stylesheet" href="style.css">
  <script src="auth.js" defer></script>
</head>
<body>
  <main class="layout">
    <div class="form-container">
      <a href="index.html" class="link-voltar">← Voltar para o início</a>

      <h2>Bem-vindo de volta!</h2>
      <p class="subtitulo">Entre com suas credenciais para acessar o acervo.</p>

      <form id="form-login">
        <div class="input-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" placeholder="seu@email.com" required>
        </div>

        <div class="input-group">
          <label for="senha">Senha</label>
          <input type="password" id="senha" placeholder="Sua senha" required>
        </div>

        <button type="submit" class="btn-enviar">Acessar conta</button>
        
        <div class="container-esqueci">
          <a href="recuperar.html" class="link-esqueci">Esqueci minha senha</a>
        </div>

        <p class="link-alternativo">
          Não tem uma conta? <a href="conta.html">Criar perfil</a>
        </p>
      </form>
    </div>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("form-login").addEventListener("submit", (e) => {
        e.preventDefault();
        const email = document.getElementById("email").value;
        const senha = document.getElementById("senha").value;

        realizarLogin(email, senha);
      });
    });
  </script>
</body>
</html>
