
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Futhis</title>
    <link rel="stylesheet" href="style/style.css">
    <script src="scripts/script.js" defer></script>
</head>
<body>
    <a href="index.html" class="logo-retornar">
    <img src="imagens/logo.png">
</a>

  <div class="form-container">
    <h2>Bem-vindo de volta!</h2>
    <p class="subtitulo">Entre com suas credenciais para acessar o acervo.</p>

    <form action="#" method="POST">
      <div class="input-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="seu@email.com" required>
      </div>

      <div class="input-group">
        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="Sua senha" required>
      </div>

      <button type="submit" class="btn-enviar">Acessar conta</button>
      
    <div class="container-esqueci">
     <a href="versao1/recuperar.html" class="link-esqueci">Esqueci minha senha</a>
      </div>

      <p class="link-alternativo">
        Não tem uma conta?<a href="versao1/conta.html">Criar perfil</a>
      </p>
    </form>
  </div>
</body>
</html>
